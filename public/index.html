<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Efsaneler Ligi Online</title><style>
:root{font-family:system-ui,Arial;color:#f1f5ff;background:#0c1222}*{box-sizing:border-box}body{margin:0}header{background:#17233c;padding:20px;text-align:center;border-bottom:2px solid #d8ac3d}h1{margin:0;color:#ffd76b}main{max-width:1000px;margin:20px auto;padding:0 15px}.panel{background:#17233c;border:1px solid #344565;border-radius:14px;padding:18px;margin-bottom:16px}button,input,select{border:0;border-radius:8px;padding:12px;font:inherit}button{background:#d8ac3d;color:#152035;font-weight:700;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#293752;color:white;max-width:100%}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#aebcda}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;max-height:540px;overflow:auto}.player{background:#263552;padding:10px;border-radius:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}.player button{padding:8px}#notice{color:#ffd76b}ul{padding-left:20px}small{color:#bac6df}</style></head><body><header><h1>⚽ EFSANELER LİGİ ONLINE</h1><div>Prime kadrolar • Online draft • 1.000.000.000 €</div></header><main>
<section class="panel" id="entry"><h2>Oyuna katıl</h2><div class="row"><input id="name" placeholder="İsmin" maxlength="25"><button id="create">Oda oluştur</button><input id="room" placeholder="Oda kodu"><button id="join">Odaya katıl</button></div></section>
<section class="panel" id="lobby" hidden><h2>Oda: <span id="roomCode"></span> <button id="copy">Kodu kopyala</button></h2><div id="members"></div><p id="phase"></p><button id="start">Draft başlat</button><button id="simulate" hidden>Maçları simüle et</button><div id="results"></div></section>
<section class="panel" id="mySquad" hidden><h2>Benim Kadrom</h2><div id="squadStats" class="muted"></div><div id="squadList"></div></section><section class="panel" id="draft" hidden><h2>Futbolcu seçimi</h2><p id="turn"></p><div class="row"><input id="search" placeholder="Futbolcu ara"><select id="position"><option value="">Tüm mevkiler</option><option>KL</option><option>DF</option><option>OS</option><option>FV</option></select></div><p class="muted">Kadrolar: 1 kaleci, 4 defans, 3 orta saha, 3 forvet. Her futbolcu yalnızca bir kez seçilebilir.</p><div class="players" id="players"></div><div class="row" style="justify-content:center;margin-top:15px"><button id="prevPage">← Önceki sayfa</button><span id="pageLabel"></span><button id="nextPage">Sonraki sayfa →</button></div></section>
<section class="panel" id="logs" hidden><h2>Seçim geçmişi</h2><ul id="history"></ul></section><p id="notice"></p></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);let roster=[],state=null,page=0,pageSize=40;
fetch('/api/players').then(r=>r.json()).then(p=>{roster=p;draw()});const emit=(ev,data)=>s.emit(ev,data);$('create').onclick=()=>emit('create',$('name').value);$('join').onclick=()=>emit('join',{name:$('name').value,code:$('room').value});$('start').onclick=()=>emit('start');$('simulate').onclick=()=>emit('simulate');$('copy').onclick=()=>navigator.clipboard.writeText(state.code);$('search').oninput=()=>{page=0;draw()};$('position').onchange=()=>{page=0;draw()};$('prevPage').onclick=()=>{page=Math.max(0,page-1);draw()};$('nextPage').onclick=()=>{page++;draw()};
s.on('errorMsg',msg=>{$('notice').textContent=msg;setTimeout(()=>$('notice').textContent='',5000)});
s.on('state',r=>{state=r;$('entry').hidden=true;$('lobby').hidden=false;$('logs').hidden=!r.log.length;$('roomCode').textContent=r.code;$('phase').textContent=r.phase==='lobby'?'Oyuncular bekleniyor':r.phase==='draft'?'Draft devam ediyor':'Kadrolar tamamlandı';$('members').innerHTML=r.members.map(m=>'<p>👤 '+esc(m.name)+' — '+m.team.length+'/11 oyuncu — '+fmt(m.budget)+'</p>').join('');$('start').hidden=r.phase!=='lobby'||r.host!==s.id;$('simulate').hidden=r.phase!=='finished'||r.host!==s.id;$('draft').hidden=r.phase!=='draft';$('history').innerHTML=r.log.slice().reverse().map(t=>'<li>'+esc(t)+'</li>').join('');$('results').innerHTML=r.result?'<h3>Maç sonuçları</h3>'+r.result.map(x=>'<p>'+esc(x.a)+' <b>'+x.ga+' - '+x.gb+'</b> '+esc(x.b)+'</p>').join(''):'';draw()});
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){if(!state||!roster.length)return;let r=state,n=r.order.length,active=r.phase==='draft'?r.order[Math.floor(r.turn/n)%2===0?r.turn%n:n-1-r.turn%n]:null;let me=r.members.find(m=>m.id===s.id),used=new Set(r.members.flatMap(m=>m.team));$('mySquad').hidden=!me;$('squadStats').textContent=me?'Bütçe: '+fmt(me.budget)+' • Oyuncu: '+me.team.length+'/11 • KL '+me.team.filter(i=>roster[i].pos==='KL').length+'/1 • DF '+me.team.filter(i=>roster[i].pos==='DF').length+'/4 • OS '+me.team.filter(i=>roster[i].pos==='OS').length+'/3 • FV '+me.team.filter(i=>roster[i].pos==='FV').length+'/3':'';$('squadList').innerHTML=me?me.team.map(i=>'<div style="padding:5px 0">'+esc(roster[i].name)+' — '+roster[i].rating+' GEN — '+fmt(roster[i].price)+'</div>').join(''):'';$('turn').textContent=active===s.id?'🟢 Seçim sırası sende!':'⏳ Sıra: '+(r.members.find(m=>m.id===active)?.name||'');let q=$('search').value.toLocaleLowerCase('tr'),pos=$('position').value;let rows=roster.map((p,i)=>({...p,i})).filter(p=>(!pos||p.pos===pos)&&p.name.toLocaleLowerCase('tr').includes(q));let pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages-1);$('pageLabel').textContent=(page+1)+' / '+pages+' ('+rows.length+' futbolcu)';$('prevPage').disabled=page===0;$('nextPage').disabled=page>=pages-1;rows=rows.slice(page*pageSize,(page+1)*pageSize);$('players').innerHTML=rows.map(p=>{let disabled=active!==s.id||used.has(p.i)||!me||me.budget<p.price||me.team.filter(i=>roster[i].pos===p.pos).length>=({KL:1,DF:4,OS:3,FV:3}[p.pos]);return '<div class="player"><div><b>'+esc(p.name)+'</b><br><small>'+p.pos+' • '+p.rating+' GEN • '+fmt(p.price)+'</small></div><button data-id="'+p.i+'" '+(disabled?'disabled':'')+'>'+(used.has(p.i)?'Seçildi':'Seç')+'</button></div>'}).join('');$('players').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>emit('pick',Number(b.dataset.id)))}
</script></body></html>
